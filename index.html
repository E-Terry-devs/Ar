<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mobile E-TERRY AR - Simple Working Version</title>
    
    <!-- Use the exact same AR.js setup as your working version -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- AR.js - using the complete build that includes everything -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
    
    <!-- GLTF Loader for modern models -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        body {
            margin: 0px;
            overflow: hidden;
            font-family: Monospace;
            background: #000;
        }

        /* Simple loading overlay */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
        }

        .loading-text {
            font-size: 18px;
            margin: 10px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Simple status */
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
            display: none;
        }

        /* Debug toggle */
        #debugToggle {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 99;
            cursor: pointer;
        }

        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-text" id="loadingText">Initializing E-TERRY AR...</div>
        <div class="spinner"></div>
    </div>
    
    <div id="status"></div>
    
    <button id="debugToggle" onclick="toggleDebug()">Debug</button>
    
    <div id="debugInfo">
        <div id="debugContent"></div>
    </div>

    <script>
        // EXACTLY like your working version
        var scene, camera, renderer, clock, deltaTime, totalTime;
        var arToolkitSource, arToolkitContext;
        var markerRoot1;
        var mesh1, mesh0;

        // Simple debug vars
        var isMarkerVisible = false;
        var frameCount = 0;

        function showStatus(text, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = text;
            status.style.display = 'block';
            status.style.borderLeft = type === 'error' ? '4px solid #f44' : 
                                     type === 'warning' ? '4px solid #fa0' : '4px solid #4a4';
            
            if (type !== 'error') {
                setTimeout(() => status.style.display = 'none', 3000);
            }
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoading() {
            document.getElementById('loadingScreen').style.display = 'none';
        }

        function toggleDebug() {
            const debug = document.getElementById('debugInfo');
            debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
        }

        function updateDebug() {
            const debugContent = document.getElementById('debugContent');
            const video = arToolkitSource ? arToolkitSource.domElement : null;
            const videoRes = video && video.videoWidth ? `${video.videoWidth}x${video.videoHeight}` : 'No video';
            
            debugContent.innerHTML = `
                <strong>Status:</strong><br>
                Marker Visible: ${isMarkerVisible ? 'YES' : 'NO'}<br>
                Video Resolution: ${videoRes}<br>
                Frames: ${frameCount}<br>
                AR Source Ready: ${arToolkitSource ? arToolkitSource.ready : 'No'}<br>
                AR Context: ${arToolkitContext ? 'Yes' : 'No'}<br>
            `;
        }

        // Start when page loads
        window.addEventListener('load', () => {
            setTimeout(initialize, 100);
        });

        function initialize() {
            updateLoadingText('Setting up 3D scene...');
            
            // EXACTLY like your working version
            scene = new THREE.Scene();

            let ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
            scene.add(ambientLight);
                        
            camera = new THREE.Camera();
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setClearColor(new THREE.Color('lightgrey'), 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            deltaTime = 0;
            totalTime = 0;
            
            updateLoadingText('Starting camera...');
            
            ////////////////////////////////////////////////////////////
            // setup arToolkitSource - EXACTLY like your working version
            ////////////////////////////////////////////////////////////

            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });

            function onResize() {
                arToolkitSource.onResize();
                arToolkitSource.copySizeTo(renderer.domElement);
                if (arToolkitContext.arController !== null) {
                    arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
                }
            }

            arToolkitSource.init(function onReady() {
                updateLoadingText('Camera ready, setting up AR...');
                onResize();
                setupARContext();
            });
            
            // handle resize event
            window.addEventListener('resize', function() {
                onResize();
            });
        }

        function setupARContext() {
            ////////////////////////////////////////////////////////////
            // setup arToolkitContext - EXACTLY like your working version
            ////////////////////////////////////////////////////////////    

            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'data/camera_para.dat',
                detectionMode: 'mono'
            });
            
            // copy projection matrix to camera when initialization complete
            arToolkitContext.init(function onCompleted() {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
                updateLoadingText('Setting up markers...');
                setupMarkers();
            });
        }

        function setupMarkers() {
            ////////////////////////////////////////////////////////////
            // setup markerRoots - EXACTLY like your working version
            ////////////////////////////////////////////////////////////

            // build markerControls
            markerRoot1 = new THREE.Group();
            scene.add(markerRoot1);
            
            let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
                type: 'pattern', 
                patternUrl: "data/eterry-logo.patt",
            });

            // EXACTLY like your working version
            let geometry1 = new THREE.PlaneBufferGeometry(1, 1, 4, 4);
            let material1 = new THREE.MeshBasicMaterial({ color: 0x0000ff, opacity: 0.5 });
            mesh1 = new THREE.Mesh(geometry1, material1);
            mesh1.rotation.x = -Math.PI/2;
            markerRoot1.add(mesh1);
            
            updateLoadingText('Loading model...');
            loadModel();
        }

        function loadModel() {
            // Try to load GLTF model, fallback to test cube
            if (typeof THREE.GLTFLoader !== 'undefined') {
                const loader = new THREE.GLTFLoader();
                
                loader.load(
                    'models/ETERRY.glb',
                    function(gltf) {
                        // Remove test plane
                        markerRoot1.remove(mesh1);
                        
                        mesh0 = gltf.scene;
                        mesh0.position.set(0, 0, 0);
                        mesh0.rotation.set(0, 0, 0);
                        mesh0.scale.set(1, 1, 1);
                        
                        // Ensure materials work
                        mesh0.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.side = THREE.DoubleSide;
                            }
                        });
                        
                        markerRoot1.add(mesh0);
                        showStatus('GLTF model loaded');
                        finishInit();
                    },
                    undefined,
                    function(error) {
                        // Fallback to test cube
                        createTestCube();
                        finishInit();
                    }
                );
            } else {
                createTestCube();
                finishInit();
            }
        }

        function createTestCube() {
            // Remove test plane
            markerRoot1.remove(mesh1);
            
            // Create animated test cube
            const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const material = new THREE.MeshNormalMaterial();
            mesh0 = new THREE.Mesh(geometry, material);
            mesh0.position.set(0, 0.15, 0);
            markerRoot1.add(mesh0);
            
            showStatus('Test cube created');
        }

        function finishInit() {
            hideLoading();
            showStatus('AR ready! Point camera at marker');
            animate();
        }

        function update() {
            // EXACTLY like your working version
            if (arToolkitSource.ready !== false)
                arToolkitContext.update(arToolkitSource.domElement);
            
            // Check marker visibility
            isMarkerVisible = markerRoot1.visible;
            
            // Animate test cube
            if (mesh0 && isMarkerVisible) {
                mesh0.rotation.x += 0.01;
                mesh0.rotation.y += 0.02;
            }
        }

        function render() {
            // EXACTLY like your working version
            renderer.render(scene, camera);
        }

        function animate() {
            requestAnimationFrame(animate);
            deltaTime = clock.getDelta();
            totalTime += deltaTime;
            frameCount++;
            
            update();
            render();
            
            // Update debug every second
            if (frameCount % 60 === 0) {
                updateDebug();
            }
        }
    </script>
</body>
</html>
