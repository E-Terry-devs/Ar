<!DOCTYPE html>
<head>
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<meta charset="utf-8">
	<title>Augmented Reality E-TERRY - CDN Draco Version</title>
	
	<!-- Include Three.js library -->
	<script src='js/three.js'></script>
	<script src='js/OBJLoader.js'></script>
	<script src='js/MTLLoader.js'></script>
	<script src='js/GLTFLoader.js'></script>
	
	<!-- Load official DRACOLoader from CDN as fallback -->
	<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/DRACOLoader.js" 
	        onerror="console.warn('CDN DRACOLoader failed, using local version')"></script>
	
	<!-- Fallback to local DRACOLoader if CDN fails -->
	<script>
		// Check if CDN DRACOLoader loaded successfully
		window.addEventListener('load', function() {
			if (typeof THREE.DRACOLoader === 'undefined') {
				console.log('Loading local DRACOLoader...');
				var script = document.createElement('script');
				script.src = 'js/DRACOLoader.js';
				document.head.appendChild(script);
			} else {
				console.log('Using CDN DRACOLoader');
			}
		});
	</script>
	
	<!-- Include jsartookit -->
	<script src="jsartoolkit5/artoolkit.min.js"></script>
	<script src="jsartoolkit5/artoolkit.api.js"></script>
	
	<!-- Include threex.artoolkit -->
	<script src="threex/threex-artoolkitsource.js"></script>
	<script src="threex/threex-artoolkitcontext.js"></script>
	<script src="threex/threex-arbasecontrols.js"></script>
	<script src="threex/threex-armarkercontrols.js"></script>
	
	<style>
		body {
			margin: 0px;
			overflow: hidden;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: #000;
		}
		
		/* Loading indicator */
		#loadingScreen {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 1000;
			color: white;
			text-align: center;
		}
		
		.spinner {
			border: 3px solid rgba(255,255,255,0.3);
			border-radius: 50%;
			border-top: 3px solid #fff;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 20px 0;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		#statusBar {
			position: fixed;
			top: 10px;
			left: 10px;
			right: 10px;
			background: rgba(0,0,0,0.7);
			color: white;
			padding: 10px;
			border-radius: 5px;
			font-size: 12px;
			z-index: 100;
			display: none;
		}
		
		.status-success { background: rgba(0,150,0,0.8) !important; }
		.status-warning { background: rgba(255,150,0,0.8) !important; }
		.status-error { background: rgba(150,0,0,0.8) !important; }
	</style>
</head>

<body>
	<div id="loadingScreen">
		<h1>E-TERRY AR</h1>
		<div class="spinner"></div>
		<p id="loadingText">Initializing...</p>
	</div>
	
	<div id="statusBar">
		<span id="statusText">Ready</span>
	</div>

<script>
// Wait for all scripts to load before initializing
window.addEventListener('load', function() {
	// Small delay to ensure all scripts are ready
	setTimeout(initializeApp, 500);
});

function initializeApp() {
	console.log('🚀 Initializing E-TERRY AR with reliable Draco support');
	
	// Global variables
	var scene, camera, renderer, clock;
	var arToolkitSource, arToolkitContext;
	var markerRoot1, currentModel;
	
	// Model options
	var modelOptions = [
		
		{
			name: 'Compressed GLB (Draco)',
			path: 'models/ETERRY_compressed.glb',
			type: 'glb',
			compressed: true
		},
		
	];
	
	// Initialize the application
	initialize();
	
	function initialize() {
		updateLoadingText('Setting up 3D scene...');
		
		// Setup Three.js scene
		scene = new THREE.Scene();
		camera = new THREE.Camera();
		scene.add(camera);
		
		var ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
		scene.add(ambientLight);
		
		// Setup renderer
		renderer = new THREE.WebGLRenderer({
			antialias: true,
			alpha: true
		});
		
		renderer.setClearColor(new THREE.Color('lightgrey'), 0);
		renderer.setSize(window.innerWidth, window.innerHeight);
		renderer.domElement.style.position = 'absolute';
		renderer.domElement.style.top = '0px';
		renderer.domElement.style.left = '0px';
		document.body.appendChild(renderer.domElement);
		
		clock = new THREE.Clock();
		
		updateLoadingText('Setting up AR...');
		setupAR();
	}
	
	function setupAR() {
		// AR source
		arToolkitSource = new THREEx.ArToolkitSource({
			sourceType: 'webcam'
		});
		
		arToolkitSource.init(function onReady() {
			console.log('📷 AR camera ready');
			updateLoadingText('Camera ready, configuring tracking...');
			onResize();
		});
		
		// Handle resize
		function onResize() {
			arToolkitSource.onResize();
			arToolkitSource.copySizeTo(renderer.domElement);
			
			if (arToolkitContext.arController !== null) {
				arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
			}
		}
		
		window.addEventListener('resize', onResize);
		
		// AR context
		arToolkitContext = new THREEx.ArToolkitContext({
			cameraParametersUrl: 'data/camera_para.dat',
			detectionMode: 'mono'
		});
		
		arToolkitContext.init(function onCompleted() {
			camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
			console.log('🎯 AR tracking ready');
			setupMarker();
		});
	}
	
	function setupMarker() {
		updateLoadingText('Setting up marker tracking...');
		
		// Setup marker
		markerRoot1 = new THREE.Group();
		scene.add(markerRoot1);
		
		var markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
			type: 'pattern', 
			patternUrl: 'data/eterry-logo.patt'
		});
		
		// Add test geometry
		var geometry = new THREE.PlaneBufferGeometry(1, 1);
		var material = new THREE.MeshBasicMaterial({ 
			color: 0x0000ff, 
			opacity: 0.5,
			transparent: true
		});
		var testMesh = new THREE.Mesh(geometry, material);
		testMesh.rotation.x = -Math.PI/2;
		markerRoot1.add(testMesh);
		
		updateLoadingText('Loading 3D model...');
		loadModel();
	}
	
	function loadModel() {
		console.log('🤖 Starting model loading process...');
		
		// Try each model option
		tryLoadModel(0);
	}
	
	function tryLoadModel(index) {
		if (index >= modelOptions.length) {
			console.error('❌ All model loading attempts failed');
			updateStatus('Model loading failed', 'error');
			hideLoadingScreen();
			return;
		}
		
		var modelOption = modelOptions[index];
		console.log(`📦 Attempting to load: ${modelOption.name}`);
		updateLoadingText(`Loading ${modelOption.name}...`);
		
		if (modelOption.type === 'glb') {
			loadGLTFModel(modelOption, function(success) {
				if (success) {
					console.log(`✅ Successfully loaded: ${modelOption.name}`);
					updateStatus(`Loaded: ${modelOption.name}`, 'success');
					hideLoadingScreen();
				} else {
					console.warn(`⚠️ Failed to load: ${modelOption.name}`);
					tryLoadModel(index + 1);
				}
			});
		} else if (modelOption.type === 'obj') {
			loadOBJModel(modelOption, function(success) {
				if (success) {
					console.log(`✅ Successfully loaded: ${modelOption.name}`);
					updateStatus(`Loaded: ${modelOption.name}`, 'success');
					hideLoadingScreen();
				} else {
					console.warn(`⚠️ Failed to load: ${modelOption.name}`);
					tryLoadModel(index + 1);
				}
			});
		}
	}
	
	function loadGLTFModel(modelOption, callback) {
		// Check if GLTFLoader is available
		if (typeof THREE.GLTFLoader === 'undefined') {
			console.error('❌ GLTFLoader not available');
			callback(false);
			return;
		}
		
		var gltfLoader = new THREE.GLTFLoader();
		
		// Setup DRACOLoader if available and needed
		if (modelOption.compressed && typeof THREE.DRACOLoader !== 'undefined') {
			console.log('🗜️ Setting up Draco decoder for compressed model...');
			
			try {
				var dracoLoader = new THREE.DRACOLoader();
				
				// Use multiple reliable decoder paths
				var decoderPaths = [
					'https://www.gstatic.com/draco/versioned/decoders/1.5.6/',
					'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/libs/draco/gltf/',
					'https://unpkg.com/three@0.152.2/examples/js/libs/draco/gltf/'
				];
				
				// Try the most reliable path first
				dracoLoader.setDecoderPath(decoderPaths[0]);
				gltfLoader.setDRACOLoader(dracoLoader);
				
				console.log('✅ Draco decoder configured');
			} catch (error) {
				console.error('❌ Failed to setup Draco decoder:', error);
				if (modelOption.compressed) {
					callback(false);
					return;
				}
			}
		} else if (modelOption.compressed) {
			console.warn('⚠️ Compressed model but no DRACOLoader available');
			callback(false);
			return;
		}
		
		// Load the model
		gltfLoader.load(
			modelOption.path,
			function(gltf) {
				console.log('✅ GLTF model loaded successfully');
				handleModelLoaded(gltf.scene);
				callback(true);
			},
			function(progress) {
				if (progress.lengthComputable) {
					var percent = Math.round(progress.loaded / progress.total * 100);
					updateLoadingText(`Loading ${modelOption.name}: ${percent}%`);
				}
			},
			function(error) {
				console.error('❌ GLTF loading failed:', error);
				callback(false);
			}
		);
	}
	
	function loadOBJModel(modelOption, callback) {
		console.log('🔄 Loading OBJ model...');
		
		// Load MTL first
		var mtlLoader = new THREE.MTLLoader();
		mtlLoader.setPath('models/');
		mtlLoader.load('ETERRY.mtl', 
			function(materials) {
				materials.preload();
				
				// Load OBJ
				var objLoader = new THREE.OBJLoader();
				objLoader.setMaterials(materials);
				objLoader.setPath('models/');
				objLoader.load('ETERRY.obj',
					function(group) {
						console.log('✅ OBJ model loaded successfully');
						handleModelLoaded(group);
						callback(true);
					},
					function(progress) {
						if (progress.lengthComputable) {
							var percent = Math.round(progress.loaded / progress.total * 100);
							updateLoadingText(`Loading ${modelOption.name}: ${percent}%`);
						}
					},
					function(error) {
						console.error('❌ OBJ loading failed:', error);
						callback(false);
					}
				);
			},
			function(progress) {
				updateLoadingText('Loading materials...');
			},
			function(error) {
				console.error('❌ MTL loading failed:', error);
				callback(false);
			}
		);
	}
	
	function handleModelLoaded(model) {
		console.log('🎉 Processing loaded model...');
		
		// Remove any existing model
		if (currentModel) {
			markerRoot1.remove(currentModel);
		}
		
		currentModel = model;
		
		// Process the model
		var meshCount = 0;
		var totalVertices = 0;
		
		model.traverse(function(child) {
			if (child.isMesh) {
				meshCount++;
				
				var vertices = child.geometry.attributes.position ? 
					child.geometry.attributes.position.count : 0;
				totalVertices += vertices;
				
				// Ensure material compatibility
				if (child.material) {
					child.material.side = THREE.DoubleSide;
					child.material.needsUpdate = true;
				}
			}
		});
		
		// Position the model appropriately for AR
		model.position.set(0, 0, 0);
		model.rotation.set(0, 0, 0);
		model.scale.set(1, 1, 1);
		
		// Add to AR marker
		markerRoot1.add(model);
		
		console.log(`🎯 Model added: ${meshCount} meshes, ${totalVertices} vertices`);
	}
	
	// Animation loop
	function animate() {
		requestAnimationFrame(animate);
		
		// Update AR
		if (arToolkitSource && arToolkitSource.ready !== false) {
			arToolkitContext.update(arToolkitSource.domElement);
		}
		
		// Render
		renderer.render(scene, camera);
	}
	
	// Start animation loop
	animate();
	
	// Utility functions
	function updateLoadingText(text) {
		var loadingText = document.getElementById('loadingText');
		if (loadingText) loadingText.textContent = text;
	}
	
	function updateStatus(text, type) {
		var statusBar = document.getElementById('statusBar');
		var statusText = document.getElementById('statusText');
		
		if (statusText) statusText.textContent = text;
		if (statusBar) {
			statusBar.className = '';
			if (type === 'success') statusBar.classList.add('status-success');
			else if (type === 'warning') statusBar.classList.add('status-warning');
			else if (type === 'error') statusBar.classList.add('status-error');
			statusBar.style.display = 'block';
		}
		
		console.log(`📊 Status: ${text}`);
	}
	
	function hideLoadingScreen() {
		var loadingScreen = document.getElementById('loadingScreen');
		if (loadingScreen) {
			loadingScreen.style.opacity = '0';
			loadingScreen.style.transition = 'opacity 0.5s ease';
			setTimeout(function() {
				loadingScreen.style.display = 'none';
			}, 500);
		}
	}
	
	// Error handling
	window.addEventListener('error', function(e) {
		console.error('💥 JavaScript Error:', e.error);
		updateStatus('Application error occurred', 'error');
	});
	
	console.log('🚀 E-TERRY AR Application initialized successfully');
}
</script>

</body>
</html>
