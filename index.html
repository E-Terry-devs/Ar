<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>E-TERRY AR</title>
    
    <!-- HTTPS required for mobile camera access -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Modern Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- AR.js for Three.js only (not A-Frame) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
    
    <!-- Modern loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Loading screen - Grey with red accents */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 50%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 400px;
        }

        .loading-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #dc143c, #ff1744);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #dc143c;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .loading-text {
            font-size: 1rem;
            opacity: 0.8;
            margin: 15px 0;
            line-height: 1.5;
        }

        /* Status bar */
        #statusBar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(139, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            display: none;
            border-left: 4px solid #ff1744;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.5);
        }

        .status-success { border-left-color: #4CAF50; }
        .status-warning { border-left-color: #FF9800; }
        .status-error { border-left-color: #f44336; }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff1744);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-card">
            <h1 class="loading-title">E-TERRY AR</h1>
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Initializing AR...</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
    
    <div id="statusBar">
        <span id="statusText">Ready</span>
    </div>

    <script>
        // Global variables
        var scene, camera, renderer, clock, deltaTime, totalTime;
        var arToolkitSource, arToolkitContext;
        var markerRoot1;
        var mesh1, currentModel;

        // Initialize
        initialize();

        function initialize() {
            updateProgress(10, 'Setting up 3D scene...');
            
            // Scene setup
            scene = new THREE.Scene();

            // Lighting
            let ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
            scene.add(ambientLight);

            // Camera
            camera = new THREE.Camera();
            scene.add(camera);

            // Renderer - simple setup like working example
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setClearColor(new THREE.Color('lightgrey'), 0);
            renderer.setSize(640, 480);
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            renderer.domElement.style.width = '100%';
            renderer.domElement.style.height = '100%';
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            deltaTime = 0;
            totalTime = 0;

            updateProgress(30, 'Setting up AR...');
            
            // Setup AR Source
            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });

            function onResize() {
                arToolkitSource.onResize();
                arToolkitSource.copySizeTo(renderer.domElement);
                if (arToolkitContext.arController !== null) {
                    arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
                }
            }

            arToolkitSource.init(function onReady() {
                onResize();
                updateProgress(50, 'Camera ready...');
            });

            // Handle resize
            window.addEventListener('resize', function() {
                onResize();
            });

            // Setup AR Context
            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'data/camera_para.dat',
                detectionMode: 'mono'
            });

            arToolkitContext.init(function onCompleted() {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
                updateProgress(70, 'AR context ready...');
            });

            // Setup marker
            markerRoot1 = new THREE.Group();
            scene.add(markerRoot1);
            
            let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
                type: 'pattern',
                patternUrl: 'data/eterry-logo.patt'
            });

            // Add test geometry
            let geometry1 = new THREE.PlaneBufferGeometry(1, 1, 4, 4);
            let material1 = new THREE.MeshBasicMaterial({ 
                color: 0x0000ff, 
                opacity: 0.5,
                transparent: true
            });
            mesh1 = new THREE.Mesh(geometry1, material1);
            mesh1.rotation.x = -Math.PI / 2;
            markerRoot1.add(mesh1);

            updateProgress(80, 'Loading model...');
            
            // Try to load model
            loadModel();
            
            // Start animation
            animate();
            
            updateProgress(100, 'AR Ready!');
            setTimeout(() => hideLoadingScreen(), 1000);
        }

        function loadModel() {
            // Check if GLTFLoader is available
            if (typeof THREE.GLTFLoader === 'undefined') {
                createTestModel();
                return;
            }

            const loader = new THREE.GLTFLoader();
            
            // Try compressed model first
            loader.load(
                'models/ETERRY_compressed.glb',
                function(gltf) {
                    handleModelLoaded(gltf.scene, 'E-TERRY Model');
                },
                null,
                function(error) {
                    // Try uncompressed
                    loader.load(
                        'models/ETERRY.glb',
                        function(gltf) {
                            handleModelLoaded(gltf.scene, 'E-TERRY Model');
                        },
                        null,
                        function() {
                            createTestModel();
                        }
                    );
                }
            );
        }

        function handleModelLoaded(model, modelName) {
            // Remove test plane if model loads successfully
            if (mesh1) {
                markerRoot1.remove(mesh1);
            }
            
            if (currentModel) {
                markerRoot1.remove(currentModel);
            }

            currentModel = model;

            model.traverse(function(child) {
                if (child.isMesh) {
                    child.material.side = THREE.DoubleSide;
                    child.material.needsUpdate = true;
                }
            });

            model.position.set(0, 0, 0);
            model.rotation.set(0, 0, 0);
            model.scale.set(1, 1, 1);

            markerRoot1.add(model);
            
            updateStatus(`Loaded: ${modelName}`, 'success');
        }

        function createTestModel() {
            // Don't create cube - keep only the plane
            updateStatus('Model files not found - using test plane', 'warning');
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            deltaTime = clock.getDelta();
            totalTime += deltaTime;

            // Update artoolkit on every frame
            if (arToolkitSource.ready !== false) {
                arToolkitContext.update(arToolkitSource.domElement);
            }

            renderer.render(scene, camera);
        }

        // UI Helper Functions
        function updateProgress(percent, text) {
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            
            if (progressBar) progressBar.style.width = `${percent}%`;
            if (loadingText) loadingText.textContent = text;
        }

        function updateStatus(text, type = 'info') {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');
            
            if (statusText) statusText.textContent = text;
            if (statusBar) {
                statusBar.className = '';
                statusBar.classList.add(`status-${type}`);
                statusBar.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => {
                        statusBar.style.display = 'none';
                    }, 3000);
                }
            }
        }

        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 1s ease';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 1000);
            }
        }
    </script>
</body>
</html>
