<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mobile E-TERRY AR - Based on Working Version</title>
    
    <!-- HTTPS required for mobile camera access -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Three.js and AR.js - Using same structure as working version -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- AR.js components in same order as working version -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
    
    <!-- Modern loaders for GLTF -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        body {
            margin: 0px;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Loading screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 90vw;
            width: 100%;
            max-width: 400px;
        }

        .loading-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1rem;
            opacity: 0.9;
            margin: 10px 0;
        }

        /* Status bar */
        #statusBar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            display: none;
            border-left: 4px solid #4CAF50;
        }

        .status-success { border-left-color: #4CAF50; }
        .status-warning { border-left-color: #FF9800; }
        .status-error { border-left-color: #f44336; }

        /* Debug info */
        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            max-height: 30vh;
            overflow-y: auto;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .debug-toggle {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 99;
            cursor: pointer;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #2196F3);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-card">
            <h1 class="loading-title">E-TERRY AR</h1>
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Initializing AR...</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
    
    <div id="statusBar">
        <span id="statusText">Ready</span>
    </div>

    <button class="debug-toggle" onclick="toggleDebug()">Debug</button>

    <div id="debugInfo">
        <div id="debugContent">Debug info will appear here...</div>
    </div>

    <script>
        // Global variables - EXACTLY like working version
        var scene, camera, renderer, clock, deltaTime, totalTime;
        var arToolkitSource, arToolkitContext;
        var markerRoot1;
        var mesh1, mesh0;

        // Additional variables for enhanced features
        var isMarkerVisible = false;
        var detectionCount = 0;
        var frameCount = 0;
        var lastDetectionTime = 0;

        // Model loading options
        var modelOptions = [
            { name: 'E-TERRY GLTF', path: 'models/ETERRY.glb', type: 'gltf' },
            { name: 'E-TERRY OBJ', path: 'models/ETERRY.obj', type: 'obj' }
        ];

        function toggleDebug() {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.style.display = debugInfo.style.display === 'none' ? 'block' : 'none';
        }

        function updateProgress(percent, text) {
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            
            if (progressBar) progressBar.style.width = `${percent}%`;
            if (loadingText) loadingText.textContent = text;
        }

        function updateStatus(text, type = 'info') {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');
            
            if (statusText) statusText.textContent = text;
            if (statusBar) {
                statusBar.className = '';
                statusBar.classList.add(`status-${type}`);
                statusBar.style.display = 'block';
                
                if (type === 'success') {
                    setTimeout(() => {
                        statusBar.style.display = 'none';
                    }, 3000);
                }
            }
        }

        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loadingScreen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 1s ease';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 1000);
            }
        }

        function updateDebugInfo() {
            const debugContent = document.getElementById('debugContent');
            if (!debugContent) return;

            const video = arToolkitSource ? arToolkitSource.domElement : null;
            const videoResolution = video && video.videoWidth ? 
                `${video.videoWidth}x${video.videoHeight}` : 'Unknown';
            
            const canvasResolution = arToolkitContext && arToolkitContext.arController ? 
                `${arToolkitContext.arController.canvas.width}x${arToolkitContext.arController.canvas.height}` : 'Unknown';

            const now = Date.now();
            const timeSinceLastDetection = lastDetectionTime ? 
                Math.round((now - lastDetectionTime) / 1000) : 'Never';

            debugContent.innerHTML = `
                <strong>AR Detection Status</strong><br>
                Marker Visible: ${isMarkerVisible ? '✅ YES' : '❌ NO'}<br>
                Detection Count: ${detectionCount}<br>
                Time Since Last: ${timeSinceLastDetection}s<br>
                <br>
                <strong>Camera Info</strong><br>
                Video Resolution: ${videoResolution}<br>
                Canvas Resolution: ${canvasResolution}<br>
                Renderer Size: ${renderer ? renderer.domElement.width + 'x' + renderer.domElement.height : 'Unknown'}<br>
                <br>
                <strong>Performance</strong><br>
                Frame Count: ${frameCount}<br>
                <br>
                <strong>Tips for Better Detection</strong><br>
                • Ensure good lighting<br>
                • Keep marker flat and steady<br>
                • Maintain 20-50cm distance<br>
                • Move camera slowly<br>
            `;
        }

        // Wait for page load
        window.addEventListener('load', function() {
            setTimeout(() => {
                updateProgress(10, 'Starting initialization...');
                initialize();
            }, 500);
        });

        function initialize() {
            updateProgress(20, 'Setting up 3D scene...');
            
            // EXACTLY like working version
            scene = new THREE.Scene();

            let ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
            scene.add(ambientLight);
                        
            camera = new THREE.Camera();
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true
            });
            renderer.setClearColor(new THREE.Color('lightgrey'), 0);
            
            // Use dynamic sizing instead of fixed 640x480
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0px';
            renderer.domElement.style.left = '0px';
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();
            deltaTime = 0;
            totalTime = 0;
            
            updateProgress(40, 'Setting up AR tracking...');
            setupAR();
        }

        function setupAR() {
            ////////////////////////////////////////////////////////////
            // setup arToolkitSource - EXACTLY like working version
            ////////////////////////////////////////////////////////////

            arToolkitSource = new THREEx.ArToolkitSource({
                sourceType: 'webcam',
            });

            function onResize() {
                arToolkitSource.onResize();
                arToolkitSource.copySizeTo(renderer.domElement);
                if (arToolkitContext.arController !== null) {
                    arToolkitSource.copySizeTo(arToolkitContext.arController.canvas);
                }
            }

            arToolkitSource.init(function onReady() {
                updateProgress(60, 'Camera initialized...');
                onResize();
                setupARContext();
            });
            
            // handle resize event
            window.addEventListener('resize', function() {
                onResize();
            });
        }

        function setupARContext() {
            ////////////////////////////////////////////////////////////
            // setup arToolkitContext - EXACTLY like working version
            ////////////////////////////////////////////////////////////    

            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'data/camera_para.dat',
                detectionMode: 'mono'
            });
            
            // copy projection matrix to camera when initialization complete
            arToolkitContext.init(function onCompleted() {
                camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
                updateProgress(80, 'AR context ready...');
                setupMarkers();
            });
        }

        function setupMarkers() {
            ////////////////////////////////////////////////////////////
            // setup markerRoots - EXACTLY like working version
            ////////////////////////////////////////////////////////////

            // build markerControls
            markerRoot1 = new THREE.Group();
            scene.add(markerRoot1);
            
            let markerControls1 = new THREEx.ArMarkerControls(arToolkitContext, markerRoot1, {
                type: 'pattern', 
                patternUrl: "data/eterry-logo.patt",
            });

            // Enhanced: Add marker detection events
            const originalUpdateMarker = markerControls1.updateWithModelViewMatrix;
            markerControls1.updateWithModelViewMatrix = function(modelViewMatrix) {
                const wasVisible = isMarkerVisible;
                const result = originalUpdateMarker.call(this, modelViewMatrix);
                
                // Check if marker is currently visible
                isMarkerVisible = markerRoot1.visible;
                
                if (isMarkerVisible && !wasVisible) {
                    // Marker found
                    detectionCount++;
                    lastDetectionTime = Date.now();
                    updateStatus('Marker detected!', 'success');
                } else if (!isMarkerVisible && wasVisible) {
                    // Marker lost
                    updateStatus('Marker lost', 'warning');
                }
                
                return result;
            };

            // Test plane - EXACTLY like working version
            let geometry1 = new THREE.PlaneBufferGeometry(1, 1, 4, 4);
            let material1 = new THREE.MeshBasicMaterial({ color: 0x0000ff, opacity: 0.5 });
            mesh1 = new THREE.Mesh(geometry1, material1);
            mesh1.rotation.x = -Math.PI/2;
            markerRoot1.add(mesh1);
            
            updateProgress(90, 'Loading 3D model...');
            loadModel();
        }

        function loadModel() {
            // Try to load GLTF first, then fallback to creating test model
            tryLoadGLTF().then(success => {
                if (success) {
                    updateStatus('GLTF model loaded successfully', 'success');
                } else {
                    // Create test model if loading fails
                    createTestModel();
                    updateStatus('Using test model - check model paths', 'warning');
                }
                
                updateProgress(100, 'AR Ready!');
                setTimeout(() => {
                    hideLoadingScreen();
                    startAnimation();
                }, 1000);
            });
        }

        function tryLoadGLTF() {
            return new Promise((resolve) => {
                if (typeof THREE.GLTFLoader === 'undefined') {
                    resolve(false);
                    return;
                }

                const loader = new THREE.GLTFLoader();
                
                loader.load(
                    'models/ETERRY.glb',
                    function(gltf) {
                        // Remove test plane
                        if (mesh1) {
                            markerRoot1.remove(mesh1);
                        }
                        
                        mesh0 = gltf.scene;
                        
                        // Apply same transformations as working version
                        mesh0.position.set(0, 0, 0);
                        mesh0.rotation.set(0, 0, 0);
                        mesh0.scale.set(1, 1, 1);
                        
                        // Ensure materials work properly
                        mesh0.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.side = THREE.DoubleSide;
                            }
                        });
                        
                        markerRoot1.add(mesh0);
                        resolve(true);
                    },
                    function(progress) {
                        // Loading progress
                        if (progress.lengthComputable) {
                            const percent = Math.round((progress.loaded / progress.total) * 100);
                            updateProgress(90 + (percent * 0.1), `Loading model: ${percent}%`);
                        }
                    },
                    function(error) {
                        console.warn('GLTF loading failed:', error);
                        resolve(false);
                    }
                );
            });
        }

        function createTestModel() {
            // Remove test plane
            if (mesh1) {
                markerRoot1.remove(mesh1);
            }
            
            // Create a more interesting test model
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const material = new THREE.MeshNormalMaterial();
            mesh0 = new THREE.Mesh(geometry, material);
            
            mesh0.position.set(0, 0.25, 0);
            mesh0.rotation.set(0, 0, 0);
            mesh0.scale.set(1, 1, 1);
            
            markerRoot1.add(mesh0);
            
            // Add simple animation
            mesh0.userData.animate = true;
        }

        function startAnimation() {
            updateStatus('AR tracking active', 'success');
            animate();
        }

        function update() {
            // EXACTLY like working version
            if (arToolkitSource.ready !== false)
                arToolkitContext.update(arToolkitSource.domElement);
            
            // Enhanced: Animate test model if it exists
            if (mesh0 && mesh0.userData.animate && isMarkerVisible) {
                mesh0.rotation.x += 0.01;
                mesh0.rotation.y += 0.02;
            }
        }

        function render() {
            // EXACTLY like working version
            renderer.render(scene, camera);
        }

        function animate() {
            requestAnimationFrame(animate);
            deltaTime = clock.getDelta();
            totalTime += deltaTime;
            frameCount++;
            
            update();
            render();
            
            // Update debug info periodically
            if (frameCount % 60 === 0) {
                updateDebugInfo();
            }
        }

        // Error handling
        window.addEventListener('error', (e) => {
            console.warn('Error:', e.error);
            updateStatus('Error occurred - check console', 'error');
        });
    </script>
</body>
</html>
