<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mobile E-TERRY AR - Red Theme</title>
    
    <!-- HTTPS required for mobile camera access -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Modern Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- AR.js for Three.js only (not A-Frame) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
    
    <!-- Modern loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Mobile-first loading screen - Updated to grey with E-TERRY red accents */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #0f0f0f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(229, 9, 20, 0.3);
            box-shadow: 0 8px 32px 0 rgba(229, 9, 20, 0.15);
            max-width: 90vw;
            width: 100%;
            max-width: 400px;
        }

        .loading-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #E50914, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #E50914;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .loading-text {
            font-size: 1rem;
            opacity: 0.9;
            margin: 10px 0;
            line-height: 1.4;
            color: #e0e0e0;
        }

        /* Mobile status bar - Updated with E-TERRY red accent */
        #statusBar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            display: none;
            border-left: 4px solid #E50914;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .status-success { border-left-color: #E50914; }
        .status-warning { border-left-color: #E50914; }
        .status-error { border-left-color: #E50914; }

        /* Mobile-optimized debug panel - Updated with red accent */
        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid rgba(229, 9, 20, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-height: 30vh;
            overflow-y: auto;
            display: none;
        }

        /* Progress bar - Updated with E-TERRY red */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #E50914, #ff4757);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Hide debug panel toggle for mobile */
        .debug-toggle {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 99;
            display: none; /* Hidden by default */
        }

        /* Prevent zoom on iOS */
        input, button, select, textarea {
            font-size: 16px;
        }

        /* Camera video styling */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-card">
            <h1 class="loading-title">E-TERRY AR</h1>
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Initializing AR...</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
    
    <div id="statusBar">
        <span id="statusText">Ready</span>
    </div>

    <script>
        // Wait for all scripts to load
        window.addEventListener('load', function() {
            setTimeout(initializeApp, 500);
        });

        function initializeApp() {
            new MobileETERRYAR();
        }

        class MobileETERRYAR {
            constructor() {
                // Core Three.js variables
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.clock = null;
                
                // AR.js variables
                this.arToolkitSource = null;
                this.arToolkitContext = null;
                this.markerRoot = null;
                this.markerControls = null;
                
                // Model
                this.currentModel = null;
                
                // Model options
                this.modelOptions = [
                    {
                        name: 'E-TERRY Compressed GLB',
                        path: 'models/ETERRY_compressed.glb',
                        type: 'glb',
                        compressed: true
                    },
                    
                ];

                this.init();
            }

            async init() {
                try {
                    this.updateProgress(10, 'Setting up 3D scene...');
                    this.setupScene();
                    
                    this.updateProgress(30, 'Setting up AR...');
                    await this.setupAR();
                    
                    this.updateProgress(50, 'Loading 3D model...');
                    await this.loadModel();
                    
                    this.updateProgress(90, 'Starting AR tracking...');
                    this.startAnimation();
                    
                    this.updateProgress(100, 'AR Ready!');
                    setTimeout(() => this.hideLoadingScreen(), 1000);

                } catch (error) {
                    this.showError('Initialization Failed', error.message);
                }
            }

            updateProgress(percent, text) {
                const progressBar = document.getElementById('progressBar');
                const loadingText = document.getElementById('loadingText');
                
                if (progressBar) progressBar.style.width = `${percent}%`;
                if (loadingText) loadingText.textContent = text;
            }

            setupScene() {
                // Initialize scene - EXACTLY like working code
                this.scene = new THREE.Scene();
                this.camera = new THREE.Camera();
                this.scene.add(this.camera);

                // Simple lighting - EXACTLY like working code
                const ambientLight = new THREE.AmbientLight(0xcccccc, 1.0);
                this.scene.add(ambientLight);

                // Setup renderer - EXACTLY like working code
                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });

                this.renderer.setClearColor(new THREE.Color('lightgrey'), 0);
                this.renderer.setSize(1920, 1080);
                this.renderer.domElement.style.position = 'absolute';
                this.renderer.domElement.style.top = '0px';
                this.renderer.domElement.style.left = '0px';
                document.body.appendChild(this.renderer.domElement);

                this.clock = new THREE.Clock();

                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());
            }

            async setupAR() {
                return new Promise((resolve, reject) => {
                    // SIMPLIFIED AR source - EXACTLY like working code
                    this.arToolkitSource = new THREEx.ArToolkitSource({
                        sourceType: 'webcam'
                    });

                    this.arToolkitSource.init(() => {
                        this.updateCameraInfo();
                        // Don't call onResize here - wait for context to be ready
                        
                        // SIMPLIFIED AR context - EXACTLY like working code
                        this.arToolkitContext = new THREEx.ArToolkitContext({
                            cameraParametersUrl: 'data/camera_para.dat',
                            detectionMode: 'mono'
                        });

                        this.arToolkitContext.init(() => {
                            this.camera.projectionMatrix.copy(
                                this.arToolkitContext.getProjectionMatrix()
                            );
                            // NOW it's safe to call onResize
                            this.onResize();
                            this.setupMarker();
                            resolve();
                        });
                    }, (error) => {
                        reject(error);
                    });
                });
            }

            setupMarker() {
                // Setup marker - EXACTLY like working code
                this.markerRoot = new THREE.Group();
                this.scene.add(this.markerRoot);

                // SIMPLIFIED marker controls - EXACTLY like working code
                this.markerControls = new THREEx.ArMarkerControls(
                    this.arToolkitContext, 
                    this.markerRoot, 
                    {
                        type: 'pattern',
                        patternUrl: 'data/eterry-logo.patt'
                    }
                );

                // Add test plane - Updated with E-TERRY red color
                const geometry = new THREE.PlaneBufferGeometry(1, 1, 4, 4);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0xE50914, 
                    opacity: 0.5,
                    transparent: true
                });
                const testMesh = new THREE.Mesh(geometry, material);
                testMesh.rotation.x = -Math.PI/2;
                this.markerRoot.add(testMesh);
            }

            async loadModel() {
                // Try loading each model option
                for (let i = 0; i < this.modelOptions.length; i++) {
                    const option = this.modelOptions[i];
                    
                    try {
                        const success = await this.tryLoadGLTF(option);
                        if (success) {
                            this.updateStatus(`Loaded: ${option.name}`, 'success');
                            return;
                        }
                    } catch (error) {
                        // Continue to next model
                    }
                }
            }

            async tryLoadGLTF(modelOption) {
                return new Promise((resolve, reject) => {
                    if (typeof THREE.GLTFLoader === 'undefined') {
                        reject(new Error('GLTFLoader not available'));
                        return;
                    }

                    const loader = new THREE.GLTFLoader();

                    // Setup Draco if needed
                    if (modelOption.compressed && typeof THREE.DRACOLoader !== 'undefined') {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        modelOption.path,
                        (gltf) => {
                            this.handleModelLoaded(gltf.scene);
                            resolve(true);
                        },
                        (progress) => {
                            if (progress.lengthComputable) {
                                const percent = Math.round((progress.loaded / progress.total) * 100);
                                this.updateProgress(50 + (percent * 0.4), `Loading model: ${percent}%`);
                            }
                        },
                        (error) => {
                            reject(error);
                        }
                    );
                });
            }

            handleModelLoaded(model) {
                // Remove any existing model
                if (this.currentModel) {
                    this.markerRoot.remove(this.currentModel);
                }

                this.currentModel = model;

                // Count meshes for debug
                let meshCount = 0;
                model.traverse((child) => {
                    if (child.isMesh) {
                        meshCount++;
                        // Ensure material compatibility
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                            child.material.needsUpdate = true;
                        }
                    }
                });

                // Position model - EXACTLY like working code
                model.position.set(0, 0, 0);
                model.rotation.set(0, 0, 0);
                model.scale.set(0.25, 0.25, 0.25);

                // Add to marker
                this.markerRoot.add(model);
            }

            startAnimation() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    // Update AR - EXACTLY like working code
                    if (this.arToolkitSource && this.arToolkitSource.ready !== false) {
                        this.arToolkitContext.update(this.arToolkitSource.domElement);
                    }
                    
                    // Run test animation if exists
                    if (this.testAnimation) {
                        this.testAnimation();
                    }
                    
                    // Render
                    this.renderer.render(this.scene, this.camera);
                };
                
                animate();
            }

            // Resize handling - EXACTLY like working code
            onResize() {
                if (this.arToolkitSource && this.arToolkitSource.ready) {
                    this.arToolkitSource.onResize();
                    this.arToolkitSource.copySizeTo(this.renderer.domElement);
                    
                    if (this.arToolkitContext && this.arToolkitContext.arController !== null) {
                        this.arToolkitSource.copySizeTo(this.arToolkitContext.arController.canvas);
                    }
                }
            }

            onWindowResize() {
                this.onResize();
            }

            updateCameraInfo() {
                // Camera info method kept but not updating UI
                const video = this.arToolkitSource.domElement;
                if (video && video.videoWidth && video.videoHeight) {
                    // Just for internal use if needed
                }
            }

            updateStatus(text, type = 'info') {
                const statusBar = document.getElementById('statusBar');
                const statusText = document.getElementById('statusText');
                
                if (statusText) statusText.textContent = text;
                if (statusBar) {
                    statusBar.className = '';
                    statusBar.classList.add(`status-${type}`);
                    statusBar.style.display = 'block';
                    
                    if (type === 'success') {
                        setTimeout(() => {
                            statusBar.style.display = 'none';
                        }, 3000);
                    }
                }
            }

            showError(title, message) {
                this.updateStatus(`Error: ${title}`, 'error');
                
                const loadingText = document.getElementById('loadingText');
                if (loadingText) {
                    loadingText.textContent = `Error: ${message}`;
                    loadingText.style.color = '#E50914';
                }
            }

            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 1s ease';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 1000);
                }
            }
        }

        // Error handling
        window.addEventListener('error', (e) => {
            // Silent error handling
        });
    </script>
</body>
</html>
