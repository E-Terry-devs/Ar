<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mobile E-TERRY AR - Improved Detection</title>
    
    <!-- HTTPS required for mobile camera access -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <!-- Modern Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- AR.js for Three.js only (not A-Frame) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>
    
    <!-- Modern loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Mobile-first loading screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #0f0f0f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px 20px;
            border: 1px solid rgba(229, 9, 20, 0.3);
            box-shadow: 0 8px 32px 0 rgba(229, 9, 20, 0.15);
            max-width: 90vw;
            width: 100%;
            max-width: 400px;
        }

        .loading-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #E50914, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #E50914;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .loading-text {
            font-size: 1rem;
            opacity: 0.9;
            margin: 10px 0;
            line-height: 1.4;
            color: #e0e0e0;
        }

        /* Mobile status bar */
        #statusBar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            display: none;
            border-left: 4px solid #E50914;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .status-success { border-left-color: #E50914; }
        .status-warning { border-left-color: #E50914; }
        .status-error { border-left-color: #E50914; }

        /* Debug info panel */
        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid rgba(229, 9, 20, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-height: 30vh;
            overflow-y: auto;
            display: none;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #E50914, #ff4757);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Debug toggle button */
        .debug-toggle {
            position: fixed;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 99;
        }

        /* Detection feedback */
        .detection-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 101;
            display: none;
        }

        .detection-active {
            background: rgba(229, 9, 20, 0.8);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Prevent zoom on iOS */
        input, button, select, textarea {
            font-size: 16px;
        }

        /* Camera video styling */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>

<body>
    <div id="loadingScreen">
        <div class="loading-card">
            <h1 class="loading-title">E-TERRY AR</h1>
            <div class="spinner"></div>
            <p class="loading-text" id="loadingText">Initializing AR...</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
    
    <div id="statusBar">
        <span id="statusText">Ready</span>
    </div>

    <div class="detection-indicator" id="detectionIndicator">
        Marker Detected
    </div>

    <button class="debug-toggle" onclick="toggleDebug()">Debug</button>

    <div id="debugInfo">
        <div id="debugContent">Debug info will appear here...</div>
    </div>

    <script>
        // Wait for all scripts to load
        window.addEventListener('load', function() {
            setTimeout(initializeApp, 500);
        });

        function initializeApp() {
            new MobileETERRYAR();
        }

        function toggleDebug() {
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.style.display = debugInfo.style.display === 'none' ? 'block' : 'none';
        }

        class MobileETERRYAR {
            constructor() {
                // Core Three.js variables
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.clock = null;
                
                // AR.js variables
                this.arToolkitSource = null;
                this.arToolkitContext = null;
                this.markerRoot = null;
                this.markerControls = null;
                
                // Model
                this.currentModel = null;
                
                // Detection tracking
                this.lastDetectionTime = 0;
                this.detectionCount = 0;
                this.isMarkerVisible = false;
                
                // Mobile optimization
                this.isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // Model options - with working URLs and fallbacks
                this.modelOptions = [
                    {
                        name: 'Sample Robot Model',
                        path: 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
                        type: 'glb',
                        compressed: false
                    },
                    {
                        name: 'Local E-TERRY Model',
                        path: 'models/ETERRY_compressed.glb',
                        type: 'glb',
                        compressed: true
                    }
                ];

                this.init();
            }

            async init() {
                try {
                    this.updateProgress(10, 'Setting up 3D scene...');
                    this.setupScene();
                    
                    this.updateProgress(30, 'Setting up AR...');
                    await this.setupAR();
                    
                    this.updateProgress(50, 'Loading 3D model...');
                    await this.loadModel();
                    
                    this.updateProgress(90, 'Starting AR tracking...');
                    this.startAnimation();
                    
                    this.updateProgress(100, 'AR Ready!');
                    setTimeout(() => this.hideLoadingScreen(), 1000);

                } catch (error) {
                    this.showError('Initialization Failed', error.message);
                }
            }

            updateProgress(percent, text) {
                const progressBar = document.getElementById('progressBar');
                const loadingText = document.getElementById('loadingText');
                
                if (progressBar) progressBar.style.width = `${percent}%`;
                if (loadingText) loadingText.textContent = text;
            }

            setupScene() {
                // Initialize scene
                this.scene = new THREE.Scene();
                this.camera = new THREE.Camera();
                this.scene.add(this.camera);

                // Enhanced lighting for better visibility
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
                directionalLight.position.set(1, 1, 1);
                this.scene.add(directionalLight);

                // Setup renderer with better mobile optimization
                this.renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true,
                    powerPreference: "high-performance"
                });

                this.renderer.setClearColor(new THREE.Color('lightgrey'), 0);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
                
                // Use dynamic sizing instead of fixed 640x480
                const width = window.innerWidth;
                const height = window.innerHeight;
                this.renderer.setSize(width, height);
                
                this.renderer.domElement.style.position = 'absolute';
                this.renderer.domElement.style.top = '0px';
                this.renderer.domElement.style.left = '0px';
                document.body.appendChild(this.renderer.domElement);

                this.clock = new THREE.Clock();

                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());
            }

            async setupAR() {
                return new Promise((resolve, reject) => {
                    // Enhanced AR source configuration for better mobile support
                    const sourceConfig = {
                        sourceType: 'webcam',
                        sourceWidth: this.isMobile ? 640 : 1280,
                        sourceHeight: this.isMobile ? 480 : 960,
                        displayWidth: window.innerWidth,
                        displayHeight: window.innerHeight
                    };

                    this.arToolkitSource = new THREEx.ArToolkitSource(sourceConfig);

                    this.arToolkitSource.init(() => {
                        this.updateCameraInfo();
                        
                        // Enhanced AR context configuration
                        const contextConfig = {
                            cameraParametersUrl: 'data/camera_para.dat',
                            detectionMode: 'mono',
                            // maxDetectionRate: 60,
                            // canvasWidth: this.isMobile ? 640 : 1280,
                            // canvasHeight: this.isMobile ? 480 : 960
                        };

                        this.arToolkitContext = new THREEx.ArToolkitContext(contextConfig);

                        this.arToolkitContext.init(() => {
                            this.camera.projectionMatrix.copy(
                                this.arToolkitContext.getProjectionMatrix()
                            );
                            this.onResize();
                            this.setupMarker();
                            this.updateDebugInfo();
                            resolve();
                        });
                    }, (error) => {
                        reject(error);
                    });
                });
            }

            setupMarker() {
                // Setup marker
                this.markerRoot = new THREE.Group();
                this.scene.add(this.markerRoot);

                // Enhanced marker controls with better detection parameters
                this.markerControls = new THREEx.ArMarkerControls(
                    this.arToolkitContext, 
                    this.markerRoot, 
                    {
                        type: 'pattern',
                        patternUrl: 'data/eterry-logo.patt',
                        changeMatrixMode: 'cameraTransformMatrix',
                        minConfidence: 0.6  // Lower threshold for better detection
                    }
                );

                // Add visual feedback for marker detection
                this.markerControls.addEventListener('markerFound', () => {
                    this.onMarkerFound();
                });

                this.markerControls.addEventListener('markerLost', () => {
                    this.onMarkerLost();
                });

                // Add test plane with better visibility - make it less prominent since we have a 3D model
                const geometry = new THREE.PlaneBufferGeometry(0.5, 0.5, 4, 4);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0xE50914, 
                    opacity: 0.3,  // More transparent
                    transparent: true,
                    side: THREE.DoubleSide
                });
                const testMesh = new THREE.Mesh(geometry, material);
                testMesh.rotation.x = -Math.PI/2;
                testMesh.name = 'testPlane'; // Name it so we can find it later
                this.markerRoot.add(testMesh);
            }

            onMarkerFound() {
                this.isMarkerVisible = true;
                this.lastDetectionTime = Date.now();
                this.detectionCount++;
                
                const indicator = document.getElementById('detectionIndicator');
                indicator.style.display = 'block';
                indicator.classList.add('detection-active');
                
                this.updateStatus('Marker Detected!', 'success');
                this.updateDebugInfo();
            }

            onMarkerLost() {
                this.isMarkerVisible = false;
                
                const indicator = document.getElementById('detectionIndicator');
                indicator.style.display = 'none';
                indicator.classList.remove('detection-active');
                
                this.updateDebugInfo();
            }

            async loadModel() {
                // Try loading each model option
                for (let i = 0; i < this.modelOptions.length; i++) {
                    const option = this.modelOptions[i];
                    
                    try {
                        const success = await this.tryLoadGLTF(option);
                        if (success) {
                            this.updateStatus(`Loaded: ${option.name}`, 'success');
                            return;
                        }
                    } catch (error) {
                        console.warn(`Failed to load ${option.name}:`, error);
                        this.updateStatus(`Failed to load ${option.name}`, 'warning');
                        // Continue to next model
                    }
                }
                
                // If no model loads, create a fallback 3D object
                this.createFallbackModel();
                this.updateStatus('Using fallback 3D model', 'warning');
            }

            createFallbackModel() {
                // Create a more interesting 3D model as fallback
                const group = new THREE.Group();
                
                // Create a rotating cube
                const cubeGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const cubeMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0xE50914,
                    transparent: true,
                    opacity: 0.8
                });
                const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                cube.position.y = 0.15;
                group.add(cube);
                
                // Create a cylinder base
                const cylinderGeometry = new THREE.CylinderGeometry(0.2, 0.25, 0.1, 8);
                const cylinderMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0xff4757
                });
                const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
                cylinder.position.y = 0.05;
                group.add(cylinder);
                
                // Add text-like geometry (simplified letters E-T)
                const textGeometry = new THREE.PlaneGeometry(0.4, 0.1);
                const textMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff,
                    side: THREE.DoubleSide
                });
                const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                textMesh.position.set(0, 0.3, 0);
                textMesh.rotation.x = -Math.PI / 6; // Slight tilt for visibility
                group.add(textMesh);
                
                this.handleModelLoaded(group);
            }

            async tryLoadGLTF(modelOption) {
                return new Promise((resolve, reject) => {
                    if (typeof THREE.GLTFLoader === 'undefined') {
                        reject(new Error('GLTFLoader not available'));
                        return;
                    }

                    const loader = new THREE.GLTFLoader();

                    // Setup Draco if needed
                    if (modelOption.compressed && typeof THREE.DRACOLoader !== 'undefined') {
                        const dracoLoader = new THREE.DRACOLoader();
                        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                        loader.setDRACOLoader(dracoLoader);
                    }

                    loader.load(
                        modelOption.path,
                        (gltf) => {
                            this.handleModelLoaded(gltf.scene);
                            resolve(true);
                        },
                        (progress) => {
                            if (progress.lengthComputable) {
                                const percent = Math.round((progress.loaded / progress.total) * 100);
                                this.updateProgress(50 + (percent * 0.4), `Loading model: ${percent}%`);
                            }
                        },
                        (error) => {
                            reject(error);
                        }
                    );
                });
            }

            handleModelLoaded(model) {
                // Remove any existing model (but keep the test plane for reference)
                if (this.currentModel) {
                    this.markerRoot.remove(this.currentModel);
                }

                this.currentModel = model;

                // Process model for better rendering
                let meshCount = 0;
                model.traverse((child) => {
                    if (child.isMesh) {
                        meshCount++;
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                            child.material.needsUpdate = true;
                            
                            // Enhance material for better visibility
                            if (child.material.map) {
                                child.material.map.flipY = false;
                            }
                        }
                    }
                });

                // Position model appropriately - make it more visible
                model.position.set(0, 0.2, 0);  // Higher above the plane
                model.rotation.set(0, 0, 0);
                model.scale.set(0.4, 0.4, 0.4);  // Larger scale for visibility

                // Add to marker - this makes it appear when marker is detected
                this.markerRoot.add(model);
                
                console.log(`Model loaded with ${meshCount} meshes`);
                this.updateStatus(`3D Model Ready (${meshCount} meshes)`, 'success');
                this.updateDebugInfo();
            }

            startAnimation() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    // Update AR with better error handling
                    if (this.arToolkitSource && this.arToolkitSource.ready !== false) {
                        try {
                            this.arToolkitContext.update(this.arToolkitSource.domElement);
                        } catch (error) {
                            console.warn('AR update error:', error);
                        }
                    }
                    
                    // Add subtle animation to model when visible
                    if (this.currentModel && this.isMarkerVisible) {
                        const time = this.clock.getElapsedTime();
                        this.currentModel.rotation.y = Math.sin(time * 0.5) * 0.1;
                    }
                    
                    // Render
                    this.renderer.render(this.scene, this.camera);
                    
                    // Update debug info periodically
                    if (Date.now() % 1000 < 16) { // Roughly every second
                        this.updateDebugInfo();
                    }
                };
                
                animate();
            }

            // Enhanced resize handling
            onResize() {
                if (this.arToolkitSource && this.arToolkitSource.ready) {
                    this.arToolkitSource.onResize();
                    this.arToolkitSource.copySizeTo(this.renderer.domElement);
                    
                    if (this.arToolkitContext && this.arToolkitContext.arController !== null) {
                        this.arToolkitSource.copySizeTo(this.arToolkitContext.arController.canvas);
                    }
                }
            }

            onWindowResize() {
                // Update renderer size
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.onResize();
            }

            updateCameraInfo() {
                const video = this.arToolkitSource.domElement;
                if (video && video.videoWidth && video.videoHeight) {
                    this.cameraInfo = {
                        videoWidth: video.videoWidth,
                        videoHeight: video.videoHeight,
                        displayWidth: window.innerWidth,
                        displayHeight: window.innerHeight
                    };
                }
            }

            updateDebugInfo() {
                const debugContent = document.getElementById('debugContent');
                if (!debugContent) return;

                const info = [
                    `Device: ${this.isMobile ? 'Mobile' : 'Desktop'}`,
                    `Screen: ${window.innerWidth}x${window.innerHeight}`,
                    `Pixel Ratio: ${window.devicePixelRatio}`,
                    '',
                    `AR Status: ${this.arToolkitContext ? 'Ready' : 'Loading'}`,
                    `Marker Visible: ${this.isMarkerVisible ? 'YES' : 'NO'}`,
                    `Detection Count: ${this.detectionCount}`,
                    `Last Detection: ${this.lastDetectionTime ? new Date(this.lastDetectionTime).toLocaleTimeString() : 'Never'}`,
                    '',
                    `3D Model Loaded: ${this.currentModel ? 'YES' : 'NO'}`,
                    `Objects in Scene: ${this.markerRoot ? this.markerRoot.children.length : 0}`
                ];

                if (this.cameraInfo) {
                    info.push(`Camera: ${this.cameraInfo.videoWidth}x${this.cameraInfo.videoHeight}`);
                }

                if (this.currentModel) {
                    let meshCount = 0;
                    this.currentModel.traverse((child) => {
                        if (child.isMesh) meshCount++;
                    });
                    info.push(`Model Meshes: ${meshCount}`);
                    info.push(`Model Position: ${this.currentModel.position.x.toFixed(2)}, ${this.currentModel.position.y.toFixed(2)}, ${this.currentModel.position.z.toFixed(2)}`);
                    info.push(`Model Scale: ${this.currentModel.scale.x.toFixed(2)}`);
                }

                debugContent.innerHTML = info.join('<br>');
            }

            updateStatus(text, type = 'info') {
                const statusBar = document.getElementById('statusBar');
                const statusText = document.getElementById('statusText');
                
                if (statusText) statusText.textContent = text;
                if (statusBar) {
                    statusBar.className = '';
                    statusBar.classList.add(`status-${type}`);
                    statusBar.style.display = 'block';
                    
                    if (type === 'success') {
                        setTimeout(() => {
                            statusBar.style.display = 'none';
                        }, 3000);
                    }
                }
            }

            showError(title, message) {
                this.updateStatus(`Error: ${title}`, 'error');
                
                const loadingText = document.getElementById('loadingText');
                if (loadingText) {
                    loadingText.textContent = `Error: ${message}`;
                    loadingText.style.color = '#E50914';
                }
            }

            hideLoadingScreen() {
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    loadingScreen.style.transition = 'opacity 1s ease';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 1000);
                }
            }
        }

        // Error handling
        window.addEventListener('error', (e) => {
            console.warn('Script error:', e.error);
        });
    </script>
</body>
</html>
